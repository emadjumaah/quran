<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="التلاوة">
  <!--
    **أيقونةُ «التلاوة» — نسبٌ ولمسةٌ تُميّز** (م٣ §١).

    نسبُها إلى المؤسسة: **بلاطةٌ خضراءُ وهلالٌ ذهبيّ** — لونا مشكاة وهلالُها
    (وهو هلالُ الرأس في التطبيق نفسِه، فتحتُه إلى اليمين كهيئته). ولمستُها التي
    تفصلها عن مشكاة: **مصحفٌ مفتوحٌ** تحت الهلال — فمشكاةُ محرابٌ ومصباح،
    والتلاوةُ مصحفٌ يُتلى.

    **وتُرسم ههنا ولا تُجلب**: كلُّ ما فيها مساراتٌ مكتوبةٌ في هذا الملفّ، ولا
    صورةَ خارجيّةٌ ولا خطَّ نصٍّ ولا اسمَ ناشرٍ يُرسم.

    **ومقاسُها يحتمل الصغر**: لا حرفَ فيها ولا تفصيلَ يذوب عند ٤٨px — كتلتان
    بيّنتان لا غير. ونظيرتُها المربّعةُ في `icon-maskable.svg` لأقنعة أندرويد
    ولأيقونة آبل، **ورسمُهما واحدٌ حرفًا**.
  -->
  <defs>
    <linearGradient id="tw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12977a" />
      <stop offset="1" stop-color="#084c3b" />
    </linearGradient>
    <linearGradient id="tw-hilal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d089" />
      <stop offset="1" stop-color="#e9a93f" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tw-tile)" />

  <!-- ═══ الهلالُ — قوسان بين قرنيه ═══
       قوسٌ خارجيٌّ (نصفُ قطره ٧٦) يمضي من القرن الأعلى إلى الأدنى **من جهة
       اليسار**، وقوسٌ داخليٌّ أضيقُ يعود منه إليه — فما بينهما هلال. **ولا
       يُرسم بدائرتين ودائرةٍ تُطرح**: قاعدتا الملء تُبقيان ما شذّ من الدائرة
       الثانية خارجَ الأولى، فيُرى قرصًا مقضومًا لا هلالًا (قِيس فرُدّ). -->
  <path fill="url(#tw-hilal)" d="M313 118A76 76 0 1 0 313 250 67 67 0 0 1 313 118Z" />

  <!-- المصحفُ مفتوحًا — صفحتان تلتقيان عند خيطٍ واحد -->
  <path
    fill="#f4ecda"
    d="M256 302c-24-16-66-22-108-18v90c42-4 84 2 108 18 24-16 66-22 108-18v-90c-42-4-84 2-108 18Z"
  />
  <path fill="none" stroke="#0b6e56" stroke-width="8" stroke-linecap="round" d="M256 302v90" />
</svg>
