<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="التلاوة">
  <!-- **أيقونةٌ مؤقّتةٌ** (بندُ ف٣ §٣): الهلالُ شكلُه شكلُ هلال الرأس في التطبيق،
       وهو من هويّة المشروع القائمة؛ **والهويّةُ النهائيّةُ في م٣** — فلا يُبنى
       ههنا شعارٌ يُعتمد ثمّ يُنقض. ولا نصَّ فيها ولا اسمَ ناشر. -->
  <rect width="512" height="512" rx="112" fill="#0b6e56" />
  <g transform="translate(64,64) scale(16)" fill="none" stroke="#f3d089" stroke-width="1.7" stroke-linejoin="round">
    <path d="M17.5 3.6A9 9 0 1 0 20.4 15 7.2 7.2 0 0 1 17.5 3.6Z" />
  </g>
</svg>
