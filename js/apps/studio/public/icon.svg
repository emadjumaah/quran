<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12977a"/>
      <stop offset="1" stop-color="#084c3b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#fff3d4" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#f3d089" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#f4c96a" stop-opacity="0"/>
    </radialGradient>
    <!-- الهلال الذهبي — مصباحُ المشكاة ومركزُ الهوية (شكلُ الهلال من hilal.svg) -->
    <linearGradient id="hilal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d089"/>
      <stop offset="1" stop-color="#e9a93f"/>
    </linearGradient>
  </defs>

  <!-- ملءٌ كامل بلا هامش — الزوايا خارج الاستدارة شفافة (أمر المالك 2026-07-29) -->
  <g>
    <!-- brand tile -->
    <rect width="512" height="512" rx="115" fill="url(#tile)"/>

    <!-- cream niche (outer arch = the مشكاة) -->
    <path fill="#f4ecda" d="M158 410 L158 322 A196 196 0 0 1 256 152.3 A196 196 0 0 1 354 322 L354 410 Z"/>
    <!-- recess (inner arch) -->
    <path fill="#053528" d="M180 410 L180 322 A152 152 0 0 1 256 190.4 A152 152 0 0 1 332 322 L332 410 Z"/>

    <!-- light filling the niche -->
    <ellipse cx="256" cy="316" rx="128" ry="150" fill="url(#halo)"/>

    <!-- الهلالُ مركزًا في قلب المحراب، مائلًا ٣٠° يسارًا -->
    <g transform="translate(256 306) rotate(-30) scale(0.1055) translate(-524.5 -640)">
      <g transform="translate(0,1280) scale(0.1,-0.1)">
        <path fill="url(#hilal)" d="M6015 12789 c-740 -46 -1469 -219 -2145 -509 -284 -121 -817 -407 -985 -528 -22 -15 -108 -77 -191 -136 -179 -126 -366 -275 -521 -412 -163 -144 -375 -344 -398 -375 -11 -15 -63 -74 -115 -131 -1223 -1342 -1815 -3153 -1624 -4968 153 -1459 796 -2809 1835 -3849 665 -665 1429 -1156 2315 -1486 406 -151 865 -268 1304 -330 341 -48 510 -59 900 -59 374 -1 519 8 810 45 85 11 182 23 215 25 33 3 121 19 195 35 707 160 1097 293 1625 554 386 191 672 366 1000 612 261 196 285 223 237 271 -17 17 -43 20 -233 25 -1742 51 -3386 839 -4545 2177 -1184 1368 -1717 3206 -1453 5010 218 1494 969 2854 2124 3849 116 100 115 98 115 132 0 52 -22 59 -186 58 -82 -1 -207 -6 -279 -10z"/>
      </g>
    </g>

    <!-- niche sill -->
    <rect x="146" y="406" width="220" height="20" rx="10" fill="#f4ecda"/>
  </g>
</svg>
